name: Membership dates and shared trainers
on:
  push:
    branches: [bravo-membership-dates-shared-trainers]
    paths: ['mern/**', '.github/workflows/membership-trainers-check.yml']
permissions:
  contents: read
concurrency:
  group: bravo-membership-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v4
      - name: Refresh isolated test fixtures
        if: hashFiles('mern/scripts/workspace-fixtures.patch.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          assert os.environ['GITHUB_REF_NAME']=='bravo-membership-dates-shared-trainers'
          patch=Path('scripts/workspace-fixtures.patch.json')
          data=json.loads(patch.read_text())
          path=Path('tests/workspace-api.test.js'); text=path.read_text()
          assert hashlib.sha256(text.encode()).hexdigest()==data['before']
          for start,end,insert in reversed(data['ops']): text=text[:start]+insert+text[end:]
          assert hashlib.sha256(text.encode()).hexdigest()==data['after']
          path.write_text(text);patch.unlink()
          PY
          git add tests/workspace-api.test.js scripts/workspace-fixtures.patch.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update isolated mocks for atomic onboarding and fresh trainer reads'
          git push origin HEAD:bravo-membership-dates-shared-trainers
      - name: Record exact reviewed commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: timeout 120s npm test
      - run: node --test --test-concurrency=1 tests/client-services.integration.js tests/member-access.integration.js tests/trainer-schedules.integration.js tests/membership-trainers.integration.js
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - run: node tests/membership-trainers.browser.mjs
      - run: node tests/client-services.browser.mjs
      - name: Capture checked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          git -C .. archive HEAD mern/server mern/shared mern/client/src mern/tests mern/package.json mern/package-lock.json .github/workflows | gzip > test-results/review-source.tar.gz
          git rev-parse HEAD > test-results/reviewed-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-trainer-verification
          path: mern/test-results/
          retention-days: 3
