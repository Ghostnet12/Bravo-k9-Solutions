name: Membership dates and shared trainers
on:
  push:
    branches: [bravo-membership-dates-shared-trainers]
    paths: ['mern/**', '.github/workflows/membership-trainers-check.yml']
permissions:
  contents: read
concurrency:
  group: bravo-membership-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mern
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact reviewed commit
        run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/reviewed-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run build | tee test-results/build.log
      - run: timeout 120s npm test | tee test-results/unit-tests.log
      - run: node --test --test-concurrency=1 tests/client-services.integration.js tests/member-access.integration.js tests/trainer-schedules.integration.js tests/membership-trainers.integration.js | tee test-results/integration-tests.log
      - name: Install isolated browser test tooling
        id: browser-install
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Membership and shared trainer browser checks
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: timeout 180s node tests/membership-trainers.browser.mjs 2>&1 | tee test-results/membership-browser.log
      - name: Previous client-services browser regression checks
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: timeout 180s node tests/client-services.browser.mjs 2>&1 | tee test-results/client-services-browser.log
      - name: Capture checked source
        if: always()
        run: |
          mkdir -p test-results
          git -C .. archive HEAD mern/server mern/shared mern/client/src mern/tests mern/package.json mern/package-lock.json .github/workflows | gzip > test-results/review-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-trainer-verification
          path: mern/test-results/
          retention-days: 3
