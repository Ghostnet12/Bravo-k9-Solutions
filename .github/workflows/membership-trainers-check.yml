name: Membership dates and shared trainers
on:
  push:
    branches: [bravo-membership-dates-shared-trainers]
    paths: ['mern/**', '.github/workflows/membership-trainers-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v4
      - name: Capture source for isolated review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          git -C .. archive HEAD mern/server mern/shared mern/client/src mern/tests mern/scripts mern/package.json mern/package-lock.json mern/vite.config.js mern/client/index.html mern/vercel.json .github/workflows | gzip > test-results/review-source.tar.gz
          tar -tzf test-results/review-source.tar.gz > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: membership-source-review
          path: mern/test-results/review-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test --test-concurrency=1 tests/client-services.integration.js tests/member-access.integration.js tests/trainer-schedules.integration.js
