name: Bravo release patch assembly
on:
  push:
    branches: ['codex/bravo-usability-20261010']
    paths: ['.github/workflows/bravo-release-lock-assembly.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'Ghostnet12/Bravo-k9-Solutions' && github.ref == 'refs/heads/codex/bravo-usability-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Assemble reviewed blobs only; do not update any branch or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          path = Path('mern/package-lock.json')
          original = path.read_bytes()
          assert hashlib.sha256(original).hexdigest() == 'c6f3e228f7438e6b7ec52b4a5f41ba84265736ead3c5a2ac382b76a554083eab', 'Lock changed; review required'
          lock = json.loads(original)
          fixes = {
            'concurrently': ('9.2.4','9.2.5','sha512-YMZlvWrTPQEhjKp60XSmMGt60+pffbv6DyRnOMvVO98+J7aF8w8Ui9FhdcOwvSixc/kyR6SoVvmejcn/2lZBqg=='),
            'proxy-addr': ('2.0.7','2.0.8','sha512-5nnx0yGyVUcY6t9RnWcARWtwT9F1D8O9rt08htPvnd49W1IgZtmLkhu9WfMzQj1cFxjHIO6connUNVW5k7AVyQ=='),
            'shell-quote': ('1.9.0','1.12.0','sha512-PcByqNyT/38F2kDNi006HAMRJaULuBzq/FOsw3qdZvX/GA9W/jamDaRskgHjubHiftXK5sIFxLNkvrXUwcof6Q=='),
            'source-map-js': ('1.2.1','1.2.2','sha512-KGj/8Y43x35aZVDtt+J4mK1hoLGHULMYfSkODJNQjNDC3oW1PqPoxMwo0pLUsWM/UEGzON/NxeHywEfNXNP3Vw=='),
          }
          for name, (old, new, integrity) in fixes.items():
            entry = lock['packages']['node_modules/'+name]
            assert entry['version'] == old
            entry.update(version=new, resolved=f'https://registry.npmjs.org/{name}/-/{name}-{new}.tgz', integrity=integrity)
          lock['packages']['node_modules/concurrently']['dependencies']['shell-quote'] = '1.12.0'
          # The patched proxy-addr package adds funding metadata; preserve npm's exact lock representation.
          lock['packages']['node_modules/proxy-addr']['funding'] = {'type':'opencollective','url':'https://opencollective.com/express'}
          content = json.dumps(lock, ensure_ascii=False, indent=2)+'\n'
          request = urllib.request.Request('https://api.github.com/repos/Ghostnet12/Bravo-k9-Solutions/git/blobs', data=json.dumps({'content':content,'encoding':'utf-8'}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}, method='POST')
          result = json.load(urllib.request.urlopen(request, timeout=30))
          expected = hashlib.sha1(b'blob '+str(len(content.encode())).encode()+b'\0'+content.encode()).hexdigest()
          assert result['sha'] == expected
          print(json.dumps({'path':str(path),'blob_sha':result['sha'],'sha256':hashlib.sha256(content.encode()).hexdigest(),'updated_packages':list(fixes),'branch_updated':False}))
          PY
