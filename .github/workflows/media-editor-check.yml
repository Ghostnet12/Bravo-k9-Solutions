name: Media editor checks
on:
  push:
    branches: [media-editor-admin-zoom-20260911, bravo-mern]
    paths: ['mern/**', '.github/workflows/media-editor-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Production build
        run: npm run build
      - name: Unit and existing regression tests
        run: npm test
      - name: Isolated media authorization and persistence tests
        run: node --test tests/media-editor.integration.js
