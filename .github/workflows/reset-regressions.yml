name: Scheduler and chat reset regression
on:
  push:
    branches: [bravo-mern]
    paths: ['mern/**', '.github/workflows/reset-regressions.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --test tests/reset.integration.js
