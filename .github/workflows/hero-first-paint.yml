name: Hero first-paint regression
on:
  push:
    branches: [bravo-mern, hero-first-paint-20260912]
    paths: ['mern/**', '.github/workflows/hero-first-paint.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Cold load, delayed media, administrator tools, and return navigation
        run: node tests/home-hero.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-first-paint-evidence
          path: mern/test-results/
