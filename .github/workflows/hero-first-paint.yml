name: Hero first-paint regression
on:
  pull_request:
    branches: [bravo-mern]
  push:
    branches: [bravo-mern, 'fix/bravo-hero-copy-*', 'feature/bravo-cinematic-*', 'feature/bravo-black-gold-*', hero-first-paint-20260912, 'polish/**', 'proof/**']
    paths: ['mern/**', '.github/workflows/hero-first-paint.yml']
permissions:
  contents: read
concurrency:
  group: hero-first-paint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Video carousel permissions, publishing and persistence
        run: node --test tests/proof-videos.integration.js
      - name: Install isolated browser test tools
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium webkit
          npx playwright install chrome
      - name: Install media decoders
        run: sudo apt-get install -y ffmpeg gstreamer1.0-libav
      - name: Verify the published homepage without signing in
        if: github.event_name == 'push' && github.ref == 'refs/heads/bravo-mern'
        run: node tests/home-hero.live.mjs
      - name: Verify hero replacement and copy saves through the real database
        run: node tests/hero-editor.browser.mjs
      - name: Verify shared theme, navigation and autoplay recovery
        run: node tests/bravo-theme.browser.mjs
      - name: Verify device uploads, hold-to-edit and real video playback
        run: node tests/proof-videos.browser.mjs
      - name: Cold load, delayed media, administrator tools, and return navigation
        run: node tests/home-hero.browser.mjs
      - name: Verify homepage conversion hierarchy and mobile fixed controls
        run: node tests/home-conversion.browser.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hero-first-paint-evidence
          path: mern/test-results/
