name: Fetch homepage ad artwork
on:
  push:
    branches: [feature/home-ad-carousel-20260926]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-ad-carousel-20260926
      - name: Inspect firestorage download client
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error 'https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js' -o /tmp/page.js
          echo "JS_SIZE=$(wc -c < /tmp/page.js)"
          python3 - <<'PY'
          import re
          s=open('/tmp/page.js',encoding='utf-8').read()
          for m in list(re.finditer(r'(?:fetch|download|api|share|publicId|shareId)',s,re.I))[:200]:
              a=max(0,m.start()-180); b=min(len(s),m.end()+280)
              print(s[a:b].replace('\n',' ')[:500])
              print('---')
          PY
