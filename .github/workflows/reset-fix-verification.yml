name: Verify Bravo reset fixes
on:
  push:
    branches: ['fix/bravo-reset-20260911']
    paths: ['.github/workflows/reset-fix-verification.yml', 'mern/**']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bravo-reset-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - name: Match the native select accessible label including its options
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mern/scripts/reset-browser-check.mjs')
          text = p.read_text()
          text = text.replace("getByLabel('Choose client', { exact: true })", "getByLabel(/^Choose client/)")
          p.write_text(text)
          PY
      - run: npm ci
        working-directory: mern
      - name: Production build
        run: npm run build
        working-directory: mern
      - name: Existing and new unit regressions
        run: npm test
        working-directory: mern
      - name: Isolated persistent reset and authorization tests
        run: node --test tests/reset.integration.js
        working-directory: mern
      - name: Install disposable browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0 >/tmp/bravo-browser-install.log 2>&1 || { tail -60 /tmp/bravo-browser-install.log; exit 1; }
          npx playwright --version
          npx playwright install --with-deps chromium webkit >/tmp/bravo-browser-deps.log 2>&1 || { tail -60 /tmp/bravo-browser-deps.log; exit 1; }
        working-directory: mern
      - name: Mobile WebKit and Chromium behavior checks
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          node scripts/reset-browser-check.mjs 2>&1 | tee test-artifacts/browser-results.txt
        working-directory: mern
      - name: Save verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bravo-reset-browser-checks
          path: mern/test-artifacts
          retention-days: 3
      - name: Commit verified browser locator refinement to the isolated fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mern/scripts/reset-browser-check.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Verify mobile calendar, account resets and stale chat response handling"
            git push origin HEAD:fix/bravo-reset-20260911
          fi
