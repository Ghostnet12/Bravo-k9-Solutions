name: Apply and verify Bravo reset fixes
on:
  push:
    branches: ['fix/bravo-reset-20260911']
    paths: ['.github/reset_patch.py', '.github/reset_mocks.py', '.github/workflows/reset-fix-verification.yml', 'mern/scripts/reset-browser-check.mjs', 'mern/tests/reset.integration.js']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bravo-reset-20260911
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - name: Apply narrowly checked source edits
        run: python3 .github/reset_patch.py && python3 .github/reset_mocks.py
      - run: npm ci
        working-directory: mern
      - name: Production build
        run: npm run build
        working-directory: mern
      - name: Existing and new unit regressions
        run: npm test
        working-directory: mern
      - name: Isolated persistent reset and authorization tests
        run: node --test tests/reset.integration.js
        working-directory: mern
      - name: Install disposable browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0 >/tmp/bravo-browser-install.log 2>&1 || { tail -60 /tmp/bravo-browser-install.log; exit 1; }
          npx playwright --version
          npx playwright install --with-deps chromium webkit >/tmp/bravo-browser-deps.log 2>&1 || { tail -60 /tmp/bravo-browser-deps.log; exit 1; }
        working-directory: mern
      - name: Mobile WebKit and Chromium behavior checks
        run: mkdir -p test-artifacts && node scripts/reset-browser-check.mjs 2>&1 | tee test-artifacts/browser-results.txt
        working-directory: mern
      - name: Save verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bravo-reset-browser-checks
          path: mern/test-artifacts
          retention-days: 3
      - name: Commit only verified source changes to the isolated fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mern/client/src mern/server/app.js mern/server/models.js mern/tests/workspace-api.test.js
          git diff --cached --stat
          git commit -m "Fix calendar toggle/reset, mobile date widths, desk clearing and durable chat history"
          git push origin HEAD:fix/bravo-reset-20260911
