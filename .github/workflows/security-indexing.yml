name: Security and indexing regression
on:
  push:
    branches: [bravo-mern, 'security/**']
  pull_request:
    branches: [bravo-mern]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-indexing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Isolated authentication, authorization, media and client regressions
        run: node --test --test-concurrency=1 tests/security-hardening.integration.js tests/client-login.integration.js tests/client-services.integration.js tests/member-access.integration.js tests/media-editor.integration.js tests/proof-videos.integration.js tests/administrator-removal.integration.js tests/client-removal.integration.js tests/site-operations.integration.js tests/lesson-library.integration.js
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Public pages without JavaScript and client sign-in on mobile
        run: |
          node tests/lesson-library.browser.mjs
          node tests/seo.browser.mjs
          node tests/carousel-swipe.browser.mjs
          node tests/customer-clarity.browser.mjs
          node tests/client-login.browser.mjs
      - name: Known dependency vulnerabilities (retry registry maintenance)
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=moderate; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-indexing-evidence
          path: mern/test-results/

  secrets:
    name: Bravo secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  codeql:
    name: Bravo CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          output: codeql-results
          upload: false
      - name: Reject high and critical CodeQL findings
        run: node mern/scripts/check-codeql.mjs codeql-results

  release-gate:
    name: Bravo release gate
    if: always()
    needs: [verify, secrets, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release check to succeed
        env:
          APPLICATION: ${{ needs.verify.result }}
          SECRETS: ${{ needs.secrets.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          test "$APPLICATION" = success
          test "$SECRETS" = success
          test "$CODEQL" = success
