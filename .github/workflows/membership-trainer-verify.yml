name: Verify membership dates and joint trainers
on:
  push:
    branches: [feature/backdated-memberships-dual-trainers-20260913]
    paths: [.github/workflows/membership-trainer-verify.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: mern
      - run: npm install --no-save --package-lock=false playwright@1.55.1
        working-directory: mern
      - run: npx playwright install --with-deps chromium webkit
        working-directory: mern
      - name: Download temporary public code archive
        working-directory: mern
        run: |
          mkdir -p test-results
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch(),page=await browser.newPage();
          try {
            await page.goto('https://firestorage.ai/ja/f/PHXp101hHlQT');
            await page.getByText('bravo-membership-trainers.zip',{exact:false}).first().waitFor({timeout:30000});
            const buttons=await page.locator('a,button').all();
            let saved=false;
            for(const button of buttons){
              if(!/ダウンロード|download/i.test(await button.innerText()))continue;
              try {
                const [download]=await Promise.all([page.waitForEvent('download',{timeout:8000}),button.click({timeout:3000})]);
                await download.saveAs('/tmp/bravo-feature-download.zip');saved=true;break;
              }catch{}
            }
            if(!saved)throw new Error('No source archive download was received.');
          } finally { await browser.close(); }
          JS
      - name: Verify source integrity and apply patch
        run: |
          python - <<'PY'
          import hashlib,io,zipfile,pathlib
          data=pathlib.Path('/tmp/bravo-feature-download.zip').read_bytes()
          expected='f7cbb8a1261fba0e9efc9f0f668e664a0a9e3909dd61984531aaac6e19b2f275'
          if hashlib.sha256(data).hexdigest()!=expected:
            with zipfile.ZipFile(io.BytesIO(data)) as outer:
              candidates=[name for name in outer.namelist() if name.endswith('bravo-membership-trainers.zip')]
              assert len(candidates)==1,'Unexpected archive wrapper'
              data=outer.read(candidates[0])
          assert hashlib.sha256(data).hexdigest()==expected,'Source archive digest mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as archive: patch=archive.read('feature.patch')
          assert hashlib.sha256(patch).hexdigest()=='2f1e7219ea65873f9f72f369a0ee1c0cf3db4a9e7fe439335f277c6bfca06265','Patch digest mismatch'
          pathlib.Path('/tmp/bravo-feature.patch').write_bytes(patch)
          PY
          git apply --check /tmp/bravo-feature.patch
          git apply /tmp/bravo-feature.patch
      - name: Preserve joint acceptance after waitlist promotion and exercise the actual booking route
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path,old,new):
            p=Path(path);s=p.read_text();assert old in s,(path,old);p.write_text(s.replace(old,new))
          replace('mern/server/bookings.js','options.acceptedBy ? !complete : !!options.requireAcceptance)', 'options.acceptedBy ? !complete : !!options.requireAcceptance || trainerIds.length > 1 || !!booking.trainerAcceptanceRequired)')
          replace('mern/client/src/BookingPage.jsx',"import { trainerChoice } from '../../shared/trainers';", "import { trainerChoice, JOINT_TRAINER_ID } from '../../shared/trainers';")
          replace('mern/client/src/BookingPage.jsx',r"resume?.trainerId || (/^[a-f\d]{24}$/i",r"resume?.trainerId || (params.get('trainer') === JOINT_TRAINER_ID || /^[a-f\d]{24}$/i")
          replace('mern/tests/membership-trainers.integration.js','getEntitlements,trainerCapacity}', 'getEntitlements,trainerCapacity,promoteTrainerWaitlist}')
          replace('mern/tests/membership-trainers.integration.js','await Booking.deleteOne({_id:full._id});', '''await Booking.deleteOne({_id:full._id});
                await promoteTrainerWaitlist(ids[1]);
                const promoted=await Booking.findById(b._id);
                assert.equal(promoted.status,'requested');assert.deepEqual(promoted.staffIds.map(String),ids);
                assert.equal(promoted.trainerAcceptanceRequired,true);
                assert.ok(await Slot.exists({_id:`${tomorrow}|11:00`,bookingId:b._id}));''')
          replace('mern/tests/membership-trainers.browser.mjs','${origin}/book?program=training','${origin}/portal?program=training')
          replace('mern/tests/membership-trainers.browser.mjs',"page.on('pageerror',e=>errors.push(e.message));", "try {\n             page.on('pageerror',e=>errors.push(e.message));")
          replace('mern/tests/membership-trainers.browser.mjs','await context.close();console.log',"} catch(error) { await page.screenshot({path:`test-results/feature-failure-${engineName}-${width}.png`,fullPage:true}); console.log('BROWSER FAILURE DOM:',await page.locator('body').innerText()); throw error; } finally { await context.close(); }\n             console.log")
          PY
      - run: npm run build
        working-directory: mern
      - name: Unit regressions
        working-directory: mern
        run: npm test 2>&1 | tee test-results/unit.log
      - name: Database regressions on disposable replica sets
        working-directory: mern
        run: node --test --test-concurrency=1 tests/client-services.integration.js tests/member-access.integration.js tests/trainer-schedules.integration.js tests/membership-trainers.integration.js 2>&1 | tee test-results/database.log
      - name: Existing browser and phone regressions
        working-directory: mern
        run: node tests/client-services.browser.mjs 2>&1 | tee test-results/browser-existing.log
      - name: New membership and joint-trainer browser regressions
        working-directory: mern
        run: node tests/membership-trainers.browser.mjs 2>&1 | tee test-results/browser-feature.log
      - name: Homepage regression
        working-directory: mern
        run: node tests/home-hero.browser.mjs 2>&1 | tee test-results/browser-home.log
      - name: Commit verified application source only
        run: |
          git restore --source=HEAD --worktree .github/workflows
          git config user.name 'Ghostnet12'
          git config user.email '131214811+Ghostnet12@users.noreply.github.com'
          git add mern/client/src mern/server mern/shared mern/tests
          git diff --cached --check
          git diff --cached --name-only | tee /tmp/staged-paths
          if grep -E '(^\.github/|test-results/)' /tmp/staged-paths; then exit 1; fi
          git commit -m 'Add backdated calendar-month onboarding and real David-and-Ashley trainer assignments'
          git push origin HEAD:feature/backdated-memberships-dual-trainers-20260913
          git rev-parse HEAD | tee mern/test-results/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-trainer-evidence
          path: mern/test-results
          retention-days: 2
