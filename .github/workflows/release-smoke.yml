name: Bravo production security smoke
on:
  push:
    branches: [bravo-mern]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bravo-production-security-smoke
  cancel-in-progress: true
jobs:
  live-security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify public health and headers while Vercel deploys
        shell: bash
        run: |
          for attempt in {1..12}; do
            if node mern/scripts/check-live-security.mjs; then exit 0; fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          exit 1
