name: Bravo production security smoke
on:
  push:
    branches: [bravo-mern]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bravo-production-security-smoke
  cancel-in-progress: true
jobs:
  live-security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify public health and headers while Vercel deploys
        shell: bash
        run: |
          for attempt in {1..12}; do
            if node mern/scripts/check-live-security.mjs; then exit 0; fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          exit 1
