name: Bravo motion verification
on:
  pull_request:
    branches: [bravo-mern]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  field-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/bravo-motion.browser.mjs
      - run: node tests/goal-scroll.browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bravo-motion
          path: |
            mern/test-results/motion-*
            mern/test-results/goal-scroll-*
          retention-days: 7
