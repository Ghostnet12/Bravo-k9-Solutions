name: Seed Bravo soundtrack
on:
  push:
    branches: [feature/site-soundtrack-clean-hero-20260928]
    paths: ['.github/workflows/seed-soundtrack.yml']
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect firestorage client chunks
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/B6N4AcCg8gE-
        run: |
          python - <<'PY'
          import os,re,urllib.request,urllib.parse
          url=os.environ['SHARE_URL']
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read(),r.geturl(),r.headers.get('content-type')
          data,final,ctype=get(url)
          text=data.decode('utf-8','replace')
          print('PAGE',final,ctype,len(data))
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',text)
          print('SCRIPTS',scripts)
          for src in scripts:
              script_url=urllib.parse.urljoin(url,src)
              try: js,js_final,js_type=get(script_url)
              except Exception as exc:
                  print('SCRIPT_ERROR',script_url,repr(exc)); continue
              source=js.decode('utf-8','replace')
              interesting=[]
              for value in re.findall(r'["\']([^"\']{1,700})["\']',source):
                  low=value.lower()
                  if any(k in low for k in ['/api/','download','signed','share','public_id','publicid','file_id','fileid','presign','storage','objectkey','blob']):
                      interesting.append(value)
              if interesting:
                  print('SCRIPT',js_final,'SIZE',len(js))
                  print('INTERESTING_BEGIN')
                  for value in sorted(set(interesting)): print(value)
                  print('INTERESTING_END')
          PY
