name: Seed Bravo soundtrack
on:
  push:
    branches: [feature/site-soundtrack-clean-hero-20260928]
    paths: ['.github/workflows/seed-soundtrack.yml']
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Retrieve uploaded soundtrack
        shell: bash
        env:
          SHARE_ID: B6N4AcCg8gE-
          API_BASE: https://api.firestorage.ai/dev/file
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          base=os.environ['API_BASE']; share=os.environ['SHARE_ID']
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def call(url,method='GET',data=None):
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read()
                      print(method,url,'STATUS',r.status,'TYPE',r.headers.get('content-type'),'SIZE',len(body))
                      return r.status,body,r.headers
              except urllib.error.HTTPError as e:
                  body=e.read()
                  print(method,url,'STATUS',e.code,'BODY',body[:1000])
                  return e.code,body,e.headers
          list_url=f'{base}/shares/{share}/files?maxResults=1000'
          status,body,_=call(list_url)
          if status!=200: raise SystemExit('file list unavailable')
          payload=json.loads(body)
          print('LIST_JSON',json.dumps(payload)[:5000])
          files=payload.get('files') or payload.get('items') or []
          if not files: raise SystemExit('no shared files')
          item=next((x for x in files if 'built-for-the-real-world' in str(x).lower()),files[0])
          file_id=item.get('fileId') or item.get('id') or item.get('_id')
          print('FILE_ID',file_id,'ITEM',json.dumps(item)[:3000])
          if not file_id: raise SystemExit('missing file id')
          endpoint=f'{base}/shares/{share}/files/{file_id}/download'
          result=None
          for method in ('GET','POST'):
              status,body,_=call(endpoint,method,b'' if method=='POST' else None)
              if status==200:
                  try:
                      data=json.loads(body)
                      if data.get('downloadUrl'): result=data['downloadUrl']; break
                  except Exception: pass
          if not result: raise SystemExit('download URL unavailable')
          print('DOWNLOAD_HOST',result.split('/')[2])
          req=urllib.request.Request(result,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              media=r.read()
              print('MEDIA',r.status,r.headers.get('content-type'),len(media))
          if len(media)<100000 or media[4:8]!=b'ftyp': raise SystemExit('download is not expected M4A')
          path='mern/client/public/audio/built-for-the-real-world.m4a'
          os.makedirs(os.path.dirname(path),exist_ok=True)
          open(path,'wb').write(media)
          PY
      - name: Commit soundtrack asset
        shell: bash
        run: |
          git config user.name "Bravo CI"
          git config user.email "actions@users.noreply.github.com"
          git add mern/client/public/audio/built-for-the-real-world.m4a
          git commit -m "Add Built for the Real World soundtrack"
          git push origin HEAD:feature/site-soundtrack-clean-hero-20260928
