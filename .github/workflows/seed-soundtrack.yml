name: Seed Bravo soundtrack
on:
  push:
    branches: [feature/site-soundtrack-clean-hero-20260928]
    paths: ['.github/workflows/seed-soundtrack.yml']
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect firestorage download client
        shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/B6N4AcCg8gE-
        run: |
          python - <<'PY'
          import os,re,urllib.request,urllib.parse
          url=os.environ['SHARE_URL']
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read(),r.geturl(),r.headers.get('content-type')
          data,final,ctype=get(url)
          text=data.decode('utf-8','replace')
          print('PAGE',final,ctype,len(data))
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',text)
          targets=[s for s in scripts if '(files)' in s and '/ja/f/' in s]
          print('SCRIPT_TARGETS',targets)
          for src in targets:
              script_url=urllib.parse.urljoin(url,src)
              js,js_final,js_type=get(script_url)
              print('SCRIPT',js_final,js_type,len(js))
              source=js.decode('utf-8','replace')
              strings=set(re.findall(r'["\']([^"\']{1,500})["\']',source))
              print('INTERESTING_BEGIN')
              for value in sorted(strings):
                  low=value.lower()
                  if any(k in low for k in ['/api/','download','signed','share','public_id','publicid','file_id','fileid','presign','storage']):
                      print(value)
              print('INTERESTING_END')
              open('/tmp/firestorage-page.js','wb').write(js)
          open('/tmp/firestorage-share.html','wb').write(data)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firestorage-inspection
          path: /tmp/firestorage-*
