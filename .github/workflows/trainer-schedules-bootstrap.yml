name: Verify live trainer schedules
on:
  push:
    branches: ['feature/public-trainer-availability-20260911']
permissions:
  contents: write
concurrency:
  group: trainer-schedule-feature
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - name: Apply exact integration changes
        run: python3 mern/scripts/apply-trainer-schedules.py && python3 mern/scripts/trainer-schedule-review.py
      - run: npm ci
        working-directory: mern
      - run: npm run build
        working-directory: mern
      - run: npm test
        working-directory: mern
      - name: Verify persistence, privacy, ownership and booking conflicts
        run: node --test tests/trainer-schedules.integration.js
        working-directory: mern
      - name: Install disposable browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0 >/tmp/install-playwright.log 2>&1 || { tail -60 /tmp/install-playwright.log; exit 1; }
          npx playwright install --with-deps chromium webkit >/tmp/install-browsers.log 2>&1 || { tail -60 /tmp/install-browsers.log; exit 1; }
        working-directory: mern
      - name: Verify homepage updates in mobile browsers
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          node scripts/trainer-schedules-browser.mjs 2>&1 | tee test-artifacts/trainer-schedule-results.txt
        working-directory: mern
      - name: Save evidence and exact working source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-schedule-verification
          path: |
            mern/test-artifacts
            mern/server
            mern/client/src
            mern/shared
            mern/tests/trainer-schedules*
            mern/scripts/trainer-schedules-browser.mjs
          retention-days: 3
      - name: Commit verified integration on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm mern/scripts/apply-trainer-schedules.py mern/scripts/trainer-schedule-review.py .github/workflows/trainer-schedules-bootstrap.yml
          git add mern/server mern/client/src mern/tests/workspace-api.test.js
          git commit -m 'Publish individual trainer schedules below homepage photos and enforce working days'
          git push origin HEAD:feature/public-trainer-availability-20260911
