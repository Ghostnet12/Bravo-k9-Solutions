name: Client schedules and manual memberships
on:
  push:
    branches: [bravo-mern, client-services-20260912, fix/schedule-print-20260912]
    paths: ['mern/**', '.github/workflows/client-services.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test --test-concurrency=1 tests/client-services.integration.js tests/member-access.integration.js tests/trainer-schedules.integration.js
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/client-services.browser.mjs
      - run: node tests/home-hero.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-services-evidence
          path: mern/test-results/
