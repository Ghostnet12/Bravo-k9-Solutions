name: Build and verify reset fixes
on:
  push:
    branches: [fix/scheduler-reset-20260911]
permissions:
  contents: write
concurrency:
  group: reset-fix-bootstrap
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - name: Apply exact source changes
        run: |
          python3 mern/scripts/apply-reset-fixes.py
          python3 mern/scripts/reset-followup.py
      - run: npm ci
        working-directory: mern
      - name: Production build
        run: npm run build
        working-directory: mern
      - name: Existing and new unit tests
        run: npm test
        working-directory: mern
      - name: Isolated database and authorization regression
        run: node --test tests/reset.integration.js
        working-directory: mern
      - name: Save source and build for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reset-fix-source
          path: |
            mern/client/src
            mern/client/dist
            mern/server
            mern/tests/reset*
          retention-days: 2
      - name: Commit tested source to the fix branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm mern/scripts/apply-reset-fixes.py mern/scripts/reset-followup.py .github/workflows/reset-fix-bootstrap.yml
          git add mern/client/src mern/server/app.js mern/tests/workspace-api.test.js
          git commit -m 'Fix scheduler toggles, mobile date sizing, desk reset and durable personal chat clear'
          git push origin HEAD:fix/scheduler-reset-20260911
