name: Booking continuity and responsive layout
on:
  push:
    branches: ['fix/booking-continuity-*']
  pull_request:
    branches: [bravo-mern]
    paths: ['mern/**', '.github/workflows/booking-continuity.yml']
permissions:
  contents: read
concurrency:
  group: booking-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  booking-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install --ignore-scripts --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/booking-continuity.browser.mjs
      - run: node tests/booking-simplicity.browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: booking-continuity-evidence
          path: mern/test-results/
