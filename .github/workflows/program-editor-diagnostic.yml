name: Isolated program editor diagnosis
on:
  push:
    branches: ['diagnostic/bravo-program-editor-20261031']
permissions:
  contents: read
jobs:
  safari-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install --ignore-scripts --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps webkit
      - name: Repeat the unchanged editing scenario with event diagnostics
        run: |
          for attempt in 1 2 3; do
            BRAVO_BROWSER_ENGINES=webkit node tests/program-editor-diagnostic.browser.mjs
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isolated-program-editor
          path: mern/test-results/program-editor-*
          retention-days: 3
