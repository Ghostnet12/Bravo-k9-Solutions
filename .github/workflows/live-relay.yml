name: Bravo cellular relay verification
on:
  pull_request:
    branches: [bravo-mern]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cellular-relay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run lint && npm run build && npm test
      - run: node --test --test-concurrency=1 tests/live-relay.integration.js tests/live.integration.js
      - run: sudo apt-get update && sudo apt-get install -y coturn
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-relay.browser.mjs && node tests/live-playback-recovery.browser.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cellular-relay-evidence
          path: mern/test-results/live-relay-*
          retention-days: 7
