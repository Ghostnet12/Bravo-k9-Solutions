name: Bravo cellular relay and guest verification
on:
  pull_request:
    branches: [bravo-mern]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Isolated public/private and relay-credential authorization
        run: node --test --test-concurrency=1 tests/live-network.integration.js tests/live.integration.js
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Install an isolated relay, never a production service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coturn
          sudo systemctl stop coturn || true
      - name: Actual UDP/TCP relayed video with direct candidates forbidden
        run: |
          node tests/live-relay.browser.mjs
          node tests/live-playback-recovery.browser.mjs
          node tests/release-screens.browser.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: relay-guest-evidence
          path: mern/test-results/live-relay-results.json
          retention-days: 7
