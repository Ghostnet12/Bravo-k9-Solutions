name: Membership and trainer workspace
on:
  push:
    branches: [feature/backdated-memberships-dual-trainers-20260913]
    paths: [.github/workflows/membership-trainer-workbench.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: mern
      - name: Export public source and locked dependencies for isolated tests
        run: tar --exclude=.git --exclude='*.env' --exclude=.vercel -czf /tmp/bravo-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: bravo-workspace
          path: /tmp/bravo-workspace.tgz
          retention-days: 1
