name: Homepage banner verification
on:
  push:
    branches: [bravo-mern, 'feature/home-status-banner-*', 'feature/banner-video-controls-*']
    paths: ['mern/**', '.github/workflows/home-banner.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test tests/site-banner.integration.js tests/proof-videos.integration.js
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/home-banner.browser.mjs
      - run: node tests/proof-carousel.browser.mjs
      - run: node tests/home-hero.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-banner-evidence
          path: mern/test-results/
