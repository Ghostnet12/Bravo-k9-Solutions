name: Bravo publisher startup verification
on:
  pull_request:
    branches: [bravo-mern]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publisher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publisher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: |
          node tests/publisher-codec-capabilities.browser.mjs
          node tests/publisher-startup.browser.mjs
        env:
          BRAVO_BROWSER_ENGINES: ${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publisher-${{ matrix.browser }}
          path: mern/test-results/publisher-*
          retention-days: 7
