name: Public indexing and rendering
on:
  pull_request:
    branches: [bravo-mern]
  push:
    branches: [bravo-mern, 'seo/**']
    paths: ['mern/**', '.github/workflows/public-indexing.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm install --ignore-scripts --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/public-content.browser.mjs
      - run: node tests/seo.browser.mjs
      - run: node tests/home-hero.browser.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-indexing-evidence
          path: mern/test-results/
