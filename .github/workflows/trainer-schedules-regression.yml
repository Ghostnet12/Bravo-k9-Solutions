name: Trainer schedule regression
on:
  push:
    branches: [bravo-mern]
    paths: ['mern/**', '.github/workflows/trainer-schedules-regression.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test tests/trainer-schedules.integration.js
