name: Customer experience verification
on:
  push:
    branches: ['feature/booking-*', 'feature/home-fixed-*']
    paths: ['mern/**', '.github/workflows/booking-guided.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mern
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/customer-clarity.browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guided-booking-evidence
          path: mern/test-results/
