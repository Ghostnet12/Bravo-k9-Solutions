version: 2
updates:
  - package-ecosystem: npm
    directory: /mern
    target-branch: bravo-mern
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: bravo-mern
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
